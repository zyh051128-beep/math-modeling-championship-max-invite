name: Private payload portable release verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install official Codex CLI and test crypto dependency
        run: |
          npm install --global @openai/codex@0.155.1
          python -m pip install cryptography
      - name: Check installer regression against current private payload
        env:
          MAXX_TEST_INVITE_CODE: ${{ secrets.MAXX_RELEASE_TEST_CODE }}
        run: python -I test_install_py.py
      - name: Prepare free document backend on Windows
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --yes --no-progress
      - name: Prepare free document backend on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              folder=aarch64
              arch=aarch64
              digest=c99fb4fe574437fc4cb820a4ca15271bca325920861f7139858b36d7f9df78ad ;;
            x86_64)
              folder=x86_64
              arch=x86-64
              digest=e26180298685274b54aa7fe6e1101c65465a372f457a6748ebd642720811db36 ;;
            *) exit 1 ;;
          esac
          version=26.2.5.2
          dir="$(mktemp -d)"
          dmg="$dir/LibreOffice.dmg"
          mount="$dir/mount"
          url="https://downloadarchive.documentfoundation.org/libreoffice/old/$version/mac/$folder/LibreOffice_${version}_MacOS_${arch}.dmg"
          curl --fail --location --retry 3 "$url" --output "$dmg"
          printf '%s  %s\n' "$digest" "$dmg" | shasum -a 256 --check
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          sudo ditto "$mount/LibreOffice.app" /Applications/LibreOffice.app
          /Applications/LibreOffice.app/Contents/MacOS/soffice --version
      - name: Prepare free document backend on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer
      - name: Actual native extraction, plugin deployment and extended runtime
        env:
          MAXX_TEST_INVITE_CODE: ${{ secrets.MAXX_RELEASE_TEST_CODE }}
        run: python -I verify_portable_release.py --install --setup-runtime --office-smoke
      # Never upload artifacts, decrypted files, runtime logs or source trees.
